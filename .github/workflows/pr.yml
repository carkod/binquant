name: PR checks
on: pull_request
env:
  SECRET_KEY: test
  ENV: ci
  FLASK_DOMAIN: https://api.terminal.binbot.in/
  FRONTEND_DOMAIN: https://terminal.binbot.in/
  PYARROW_IGNORE_TIMEZONE: "1"

jobs:
  deploy_binquant:
    name: Test and deploy binquant
    runs-on: ubuntu-latest
    env:
      IMAGE: binquant:latest

    steps:
      - name: Check out the repo
        uses: actions/checkout@v7.0.1
      - name: Build image
        run: docker build --tag "$IMAGE" .
      - name: Test container starts
        run: docker run --name binquant -d "$IMAGE"
      - name: Tag images
        if: ${{ github.actor != 'dependabot[bot]' }}
        run: |
          docker commit "$IMAGE" "carloswufei/$IMAGE" &
          docker tag "$IMAGE" "carloswufei/$IMAGE"
      - name: Push to Docker Hub
        if: ${{ github.actor != 'dependabot[bot]' }}
        run: |
          docker login -u ${{ secrets.DOCKER_USERNAME }} -p ${{ secrets.DOCKER_PASSWORD }}
          docker push "carloswufei/$IMAGE"

  python-tests:
    name: 🐍 Free-threaded Python tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1

      - name: Install uv
        uses: astral-sh/setup-uv@v10.3.3
        with:
          version: latest

      - name: Run tests
        run: |
          uv sync --locked --all-extras --dev
          uv run --locked python - <<'PY'
          import sys
          import sysconfig
          import pytest

          assert sysconfig.get_config_var("Py_GIL_DISABLED") == 1
          assert not sys._is_gil_enabled(), "Tests require the GIL disabled"
          result = pytest.main(["."])
          assert not sys._is_gil_enabled(), "A dependency re-enabled the GIL"
          sys.exit(result)
          PY

  python-linting:
    name: Python code linting
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v7.0.1
      - name: Install uv
        uses: astral-sh/setup-uv@v10.3.3
        with:
          enable-cache: true
      # Setup Python (faster than using Python container)
      - name: Setup Python
        uses: actions/setup-python@v7.1.0
        with:
          python-version-file: "./.python-version"
      - name: Install the project
        run: uv sync --all-extras --dev
      - name: Run linters
        run: |
          uv run ruff check .
          uv run mypy .
